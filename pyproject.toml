[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mscids-dwl-project"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "openmeteo-requests",
    "requests-cache",
    "retry-requests",
    "pandas",
    "requests",
    "black"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
